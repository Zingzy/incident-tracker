name: incidents

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: incidents
      POSTGRES_USER: incidents
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incidents-local-only}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidents -d incidents"]
      interval: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    image: incidents-backend:local
    environment:
      DATABASE_URL: postgresql+psycopg://incidents:${POSTGRES_PASSWORD:-incidents-local-only}@postgres:5432/incidents
      ENVIRONMENT: compose
      APP_VERSION: local
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 3s
      retries: 20
    ports:
      - "18211:8000"

  frontend:
    build:
      context: ./frontend
    image: incidents-frontend:local
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:8080"

volumes:
  postgres-data:
