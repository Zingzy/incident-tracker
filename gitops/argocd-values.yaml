# argo-cd chart 10.9.6 cut down for a single-node kind cluster.
dex:
  enabled: false
notifications:
  enabled: false
applicationSet:
  replicas: 0
configs:
  params:
    server.insecure: true
  cm:
    timeout.reconciliation: 60s
controller:
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {memory: 512Mi}
repoServer:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 256Mi}
server:
  resources:
    requests: {cpu: 20m, memory: 64Mi}
    limits: {memory: 192Mi}
redis:
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {memory: 64Mi}
