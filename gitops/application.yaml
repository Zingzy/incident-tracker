apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: incidents
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Zingzy/incident-tracker.git
    targetRevision: main
    path: gitops/incidents-kind
    helm:
      releaseName: incidents
  destination:
    server: https://kubernetes.default.svc
    namespace: incidents
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
