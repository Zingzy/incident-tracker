imagePullSecrets: []

backend:
  image: ghcr.io/zingzy/incident-tracker-backend
  tag: ""
  pullPolicy: IfNotPresent
  replicas: 2
  port: 8000
  resources:
    requests: {cpu: 50m, memory: 96Mi}
    limits: {cpu: 500m, memory: 256Mi}
  readinessPath: /ready
  livenessPath: /health

frontend:
  image: ghcr.io/zingzy/incident-tracker-frontend
  tag: ""
  pullPolicy: IfNotPresent
  replicas: 2
  port: 8080
  resources:
    requests: {cpu: 10m, memory: 16Mi}
    limits: {cpu: 200m, memory: 64Mi}

config:
  environment: kind
  siteTitle: Incident Tracker

postgres:
  image: postgres:17-alpine
  database: incidents
  username: incidents
  # Local clusters only. A real cluster would take this from an external secret store.
  password: incidents-dev-only
  storage: 1Gi
  storageClassName: ""
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 384Mi}

ingress:
  enabled: true
  className: nginx
  host: incidents.localhost

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  cpuUtilization: 70

monitoring:
  serviceMonitor:
    enabled: false
    labels: {}
    interval: 15s
  grafanaDashboard:
    enabled: false
