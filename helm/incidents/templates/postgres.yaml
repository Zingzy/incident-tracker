{{- $sel := dict "root" . "component" "postgres" -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "incidents.fullname" . }}-postgres
  labels:
    {{- include "incidents.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "incidents.selectorLabels" $sel | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "incidents.fullname" . }}-postgres
  labels:
    {{- include "incidents.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "incidents.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "incidents.selectorLabels" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "incidents.selectorLabels" $sel | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 70
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          envFrom:
            - secretRef:
                name: {{ include "incidents.fullname" . }}-db
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- with .Values.postgres.storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.storage }}
