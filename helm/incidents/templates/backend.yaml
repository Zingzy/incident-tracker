{{- $sel := dict "root" . "component" "backend" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "incidents.fullname" . }}-backend
  labels:
    {{- include "incidents.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.backend.replicas }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "incidents.selectorLabels" $sel | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "incidents.selectorLabels" $sel | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          command: ["sh", "-c", "until pg_isready -h {{ include "incidents.fullname" . }}-postgres -p 5432 -t 2; do sleep 2; done"]
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {cpu: 100m, memory: 32Mi}
          securityContext:
            runAsUser: 70
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      containers:
        - name: backend
          image: {{ include "incidents.image" (dict "name" "backend" "values" .Values.backend) }}
          imagePullPolicy: {{ .Values.backend.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.port }}
          envFrom:
            - configMapRef:
                name: {{ include "incidents.fullname" . }}-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "incidents.fullname" . }}-db
                  key: DATABASE_URL
          startupProbe:
            httpGet: {path: {{ .Values.backend.livenessPath }}, port: http}
            periodSeconds: 3
            failureThreshold: 40
          readinessProbe:
            httpGet: {path: {{ .Values.backend.readinessPath }}, port: http}
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: {{ .Values.backend.livenessPath }}, port: http}
            periodSeconds: 15
            failureThreshold: 3
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "incidents.fullname" . }}-backend
  labels:
    {{- include "incidents.labels" . | nindent 4 }}
    {{- include "incidents.selectorLabels" $sel | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "incidents.selectorLabels" $sel | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.backend.port }}
      targetPort: http
